name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Swift 6 language mode and typed throws need a current Xcode.
      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Check translations
        run: scripts/check-localization.sh
      - name: Validate rules.json
        run: python3 -c "import json; json.load(open('Sources/LustroCore/Resources/rules.json'))"
