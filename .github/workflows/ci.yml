name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Swift 6 language mode and typed throws need a current Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Check translations
        run: scripts/check-localization.sh
      - name: Validate rules.json
        run: python3 -c "import json; json.load(open('Sources/LustroCore/Resources/rules.json'))"
