name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Validate rules.json
        run: python3 -c "import json; json.load(open('Sources/LustroCore/Resources/rules.json'))"
