name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the publish job, which runs no third-party code and never sees the
# source tree, gets permission to create the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Actions are pinned to full commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Swift 6 language mode and typed throws need a current Xcode.
      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Package
        run: cd build && ditto -c -k --keepParent Lustro.app Lustro.zip && shasum -a 256 Lustro.zip > Lustro.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/Lustro.zip
            build/Lustro.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Lustro.zip Lustro.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --latest --generate-notes
