name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Swift 6 language mode and typed throws need a current Xcode.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Package
        run: cd build && ditto -c -k --keepParent Lustro.app Lustro.zip && shasum -a 256 Lustro.zip > Lustro.zip.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Lustro.zip build/Lustro.zip.sha256 \
            --title "Lustro $GITHUB_REF_NAME" --generate-notes
